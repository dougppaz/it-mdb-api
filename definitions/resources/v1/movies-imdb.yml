schema: definitions/schemas/movie-v1.json
source: imdb
endpoint: /v1/movies/tt{imdb_id}
description: Retrieve movie details using IMDb identifier.

parameters:
  path:
    - name: imdb_id
      type: string
      pattern: '^tt\d+$'
      required: true
      description: IMDb ID starting with 'tt' followed by digits (e.g. tt0107290).
  query:
    - name: language
      type: string
      default: en
      required: false
      description: Language code for localized title/content (e.g. en, pt-BR).

behavior:
  cache:
    key_pattern: "movie:imdb:{imdb_id}:{language}"
    ttl_seconds: 86400
    negative_ttl_seconds: 300
  parser: definitions/parsers/imdb_movie.py
