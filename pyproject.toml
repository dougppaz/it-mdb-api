[project]
name = "it-mdb-api"
version = "0.1.0"
description = "A cached, multi-language REST API for retrieving movie and TV show titles from IMDb and TMDB"
authors = [
    {name = "Douglas Paz",email = "eu@douglaspaz.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.17.2,<0.18.0)"
]
